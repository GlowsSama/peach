name: Publish Dev Image

on:
  push:
    branches:
      - master
      - feat/cosplaytele-follow
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - src/**
      - migrations/**
      - web/**
      - resources/**
      - pyproject.toml
      - uv.lock
      - setup.py
      - MANIFEST.in
      - scripts/smoke_docker.py
      - .github/workflows/ghcr-dev.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish Linux amd64 dev image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Create version tag
        id: version
        run: echo "tag=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)-dev" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ghcr.io/glowssama/peach:dev
            ghcr.io/glowssama/peach:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate candidate image
        run: python3 scripts/smoke_docker.py ghcr.io/glowssama/peach:dev
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish dev and version tags
        run: |
          docker push ghcr.io/glowssama/peach:dev
          docker push "ghcr.io/glowssama/peach:${{ steps.version.outputs.tag }}"
      - name: Write image summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "ghcr.io/glowssama/peach:dev"
            echo "ghcr.io/glowssama/peach:${{ steps.version.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
